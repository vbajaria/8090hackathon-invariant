name: Verify behavioral evidence
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: npm ci
      - run: python -m venv .venv && .venv/bin/pip install -r requirements.lock.txt
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:oracle
      - run: .venv/bin/python -m pytest finance/tests -q
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verification-diagnostics
          path: test-results/
